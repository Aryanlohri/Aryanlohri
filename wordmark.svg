<svg width="420" height="350" viewBox="0 0 420 350" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <style>
    .wipe { animation: wipeIn 0.8s cubic-bezier(.16,1,.3,1) both; transform-box: fill-box; transform-origin: center; }
    @keyframes wipeIn {
      0%   { opacity: 0; transform: translateX(-28px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .rock { animation: rock 4.5s ease-in-out 0.8s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rock {
      0%   { transform: rotate(0deg); }
      33%  { transform: rotate(2.5deg); }
      66%  { transform: rotate(-2.5deg); }
      100% { transform: rotate(0deg); }
    }
    .tag { opacity: 0; animation: tagIn 0.6s ease-out 0.9s both; }
    @keyframes tagIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .wipe, .rock, .tag { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>

  <rect width="420" height="350" fill="#0a0a0a"/>

  <!-- terminal title bar -->
  <rect x="0" y="0" width="420" height="30" fill="#111111"/>
  <line x1="0" y1="30" x2="420" y2="30" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="16" cy="15" r="4.5" fill="#4a4a4a"/>
  <circle cx="30" cy="15" r="4.5" fill="#4a4a4a"/>
  <circle cx="44" cy="15" r="4.5" fill="#4a4a4a"/>
  <text x="404" y="19" fill="#5a5a5a" font-size="10" letter-spacing="1" text-anchor="end">~/wordmark.sh</text>

  <g transform="translate(0,30)">
    <rect x="0.5" y="0.5" width="419" height="319" fill="none" stroke="#2a2a2a" stroke-width="1"/>

    <g class="wipe">
      <g class="rock">
        <text x="210" y="160" fill="#f5f5f5" font-size="56" font-weight="800" letter-spacing="2" text-anchor="middle">ARYAN</text>
        <text x="210" y="216" fill="#f5f5f5" font-size="56" font-weight="800" letter-spacing="2" text-anchor="middle">LOHRI</text>
      </g>
    </g>

    <text class="tag" x="210" y="252" fill="#6a6a6a" font-size="12" letter-spacing="3" text-anchor="middle">FULLSTACK DEVELOPER · AI/ML</text>
  </g>
</svg>
