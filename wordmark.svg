<svg width="420" height="320" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="320">
        <animate attributeName="width" from="0" to="420" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="420" height="320" fill="#0a0a0a"/>
  <g stroke="#161616" stroke-width="1">
    <line x1="105" y1="0" x2="105" y2="320"/>
    <line x1="210" y1="0" x2="210" y2="320"/>
    <line x1="315" y1="0" x2="315" y2="320"/>
    <line x1="0" y1="107" x2="420" y2="107"/>
    <line x1="0" y1="213" x2="420" y2="213"/>
  </g>
  <rect x="0.5" y="0.5" width="419" height="319" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <g clip-path="url(#wipe)">
    <g id="rockGroup" transform-origin="210 160">
      <text x="210" y="160" fill="#f5f5f5" font-size="56" font-weight="800" letter-spacing="2" text-anchor="middle">ARYAN</text>
      <text x="210" y="216" fill="#f5f5f5" font-size="56" font-weight="800" letter-spacing="2" text-anchor="middle">LOHRI</text>
      <animateTransform attributeName="transform" type="rotate"
        values="0 210 160; 2.5 210 160; -2.5 210 160; 0 210 160"
        keyTimes="0; 0.33; 0.66; 1"
        dur="4.5s" begin="1.1s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </g>
  </g>

  <text x="210" y="252" fill="#6a6a6a" font-size="12" letter-spacing="3" text-anchor="middle" opacity="0">
    FULLSTACK DEVELOPER · AI/ML
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/>
  </text>
</svg>
