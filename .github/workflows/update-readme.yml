name: Update contribution heatmap

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (~8:30 AM IST)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate mark (live commit caption)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generate_mark.py

      - name: Generate heatmap
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generate_heatmap.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg al-mark.svg
          git diff --cached --quiet || git commit -m "chore: refresh mark + heatmap"
          git push
