<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" fill="url(#bg)"/>

  <!-- vertical grid lines, 147px columns like the portfolio -->
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="320"/>
    <line x1="147" y1="0" x2="147" y2="320"/>
    <line x1="294" y1="0" x2="294" y2="320"/>
    <line x1="441" y1="0" x2="441" y2="320"/>
    <line x1="599" y1="0" x2="599" y2="320"/>
  </g>

  <!-- outer frame -->
  <rect x="0.5" y="0.5" width="599" height="319" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- header -->
  <text x="28" y="52" fill="#f5f5f5" font-size="28" font-weight="700" letter-spacing="1">ARYAN LOHRI</text>
  <text x="28" y="76" fill="#8a8a8a" font-size="13" letter-spacing="2">FULLSTACK DEVELOPER · AI/ML STUDENT</text>

  <line x1="28" y1="94" x2="572" y2="94" stroke="#2a2a2a" stroke-width="1"/>

  <!-- deadpan three-line bio -->
  <text x="28" y="126" fill="#e0e0e0" font-size="15">BTech CSE, AI/ML specialization.</text>
  <text x="28" y="148" fill="#e0e0e0" font-size="15">Two years building. Mostly at 1am.</text>
  <text x="28" y="170" fill="#e0e0e0" font-size="15">Ships things that work.</text>

  <line x1="28" y1="190" x2="572" y2="190" stroke="#2a2a2a" stroke-width="1"/>

  <!-- stack row -->
  <text x="28" y="214" fill="#6a6a6a" font-size="11" letter-spacing="2">STACK</text>
  <text x="28" y="236" fill="#f5f5f5" font-size="14">MERN · Next.js · Docker · PostgreSQL</text>

  <!-- currently building row -->
  <text x="28" y="264" fill="#6a6a6a" font-size="11" letter-spacing="2">CURRENTLY</text>
  <text x="28" y="286" fill="#f5f5f5" font-size="14">Vanta — an AI code reviewer</text>

  <!-- corner mark -->
  <text x="572" y="308" fill="#4a4a4a" font-size="11" text-anchor="end">aryanlohri.xyz</text>
</svg>
